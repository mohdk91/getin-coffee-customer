workflows:
  ios-testflight:
    name: GETIN Coffee - iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90

    environment:
      groups:
        - appstore_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.getincoffee.getinCoffee
      vars:
        BUNDLE_ID: com.getincoffee.getinCoffee
        APP_ENV: prod
        API_BASE_URL: https://portal.getincoffee.com
        API_TIMEOUT_SECONDS: "20"
      flutter: stable
      xcode: 26.4
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Verify iOS identifiers
        script: |
          set -e
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.getincoffee.getinCoffee;' ios/Runner.xcodeproj/project.pbxproj
          grep -A1 '<key>BUNDLE_ID</key>' ios/Runner/GoogleService-Info.plist | grep -q 'com.getincoffee.getinCoffee'
          echo "Bundle identifier verification: PASS"

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Flutter analyze
        script: |
          flutter --version
          dart --version
          flutter analyze --no-fatal-infos

      - name: Flutter tests
        script: |
          flutter test

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Apply provisioning profiles
        script: |
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          set -e

          if [ -z "${APP_STORE_APPLE_ID:-}" ]; then
            echo "APP_STORE_APPLE_ID is missing from the appstore_credentials group."
            exit 1
          fi

          LATEST_BUILD_NUMBER="$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)"
          case "$LATEST_BUILD_NUMBER" in
            ''|*[!0-9]*) LATEST_BUILD_NUMBER=0 ;;
          esac
          BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))

          echo "App Store build number: $BUILD_NUMBER"

          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number="$BUILD_NUMBER" \
            --dart-define=APP_ENV="$APP_ENV" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=API_TIMEOUT_SECONDS="$API_TIMEOUT_SECONDS" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
        submit_to_app_store: false
